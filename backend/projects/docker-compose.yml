services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: projects-db
    environment:
      POSTGRES_DB: projects
      POSTGRES_USER: projects
      POSTGRES_PASSWORD: projects321
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U projects -d projects"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - projects-network

  # Spring Boot Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: projects-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/projects
      SPRING_DATASOURCE_USERNAME: projects
      SPRING_DATASOURCE_PASSWORD: projects321
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_FLYWAY_ENABLED: true
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - projects-network

volumes:
  postgres_data:

networks:
  projects-network:
    driver: bridge

